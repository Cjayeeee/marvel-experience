<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121011" />

      name="description"
      content="Marvel: Multiverse is an unofficial fan archive of every universe, every hero and every possibility."

    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MULTIVERSE in large letters over a halftone Earth" />
    <meta name="twitter:card" content="summary_large_image" />

    <div id="root"></div>
